function b(x){return Uint8Array.from(atob(x),c=>c.charCodeAt(0));}
async function unlock(pw){
 const salt=b(CFG.salt);
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:CFG.iter,hash:'SHA-256'},km,256);
 const key=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
 const u=b(CFG.ct), iv=u.slice(0,12), ct=u.slice(12);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
 sessionStorage.setItem('twq_k', btoa(String.fromCharCode.apply(null,new Uint8Array(bits))));
 const html=new TextDecoder().decode(plain);
 document.open(); document.write(html); document.close();
}
async function go(){
 const pw=document.getElementById('pw').value;
 if(!pw)return;
 document.getElementById('err').style.display='none';
 document.getElementById('busy').style.display='block';
 try{
  await unlock(pw);
  try{if(document.getElementById('rm')&&document.getElementById('rm').checked)localStorage.setItem('twq_pw',pw);}catch(e){}
 }catch(e){
  document.getElementById('busy').style.display='none';
  document.getElementById('err').style.display='block';
 }
}
document.getElementById('go').addEventListener('click',go);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
try{
 const saved=localStorage.getItem('twq_pw');
 if(saved){document.getElementById('pw').value=saved; go();}
}catch(e){}
</script></body></html>
