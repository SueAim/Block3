function b(x){return Uint8Array.from(atob(x),c=>c.charCodeAt(0));}
function writeApp(html){
 if(self.__unlocked)return; self.__unlocked=1;
 var doc=new DOMParser().parseFromString(html,'text/html');
 var incoming=document.adoptNode(doc.documentElement);
 document.replaceChild(incoming, document.documentElement);
 var scripts=Array.prototype.slice.call(document.querySelectorAll('script'));
 for(var i=0;i<scripts.length;i++){
  var oldS=scripts[i], s=document.createElement('script');
  if(oldS.src){s.src=oldS.src;} else {s.textContent=oldS.textContent;}
  oldS.parentNode.replaceChild(s, oldS);
 }
 try{window.scrollTo(0,0);}catch(e){}
}
async function unlock(pw){
 const salt=b(CFG.salt);
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:CFG.iter,hash:'SHA-256'},km,256);
 const key=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
 const u=b(CFG.ct), iv=u.slice(0,12), ct=u.slice(12);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
 sessionStorage.setItem('twq_k', btoa(String.fromCharCode.apply(null,new Uint8Array(bits))));
 writeApp(new TextDecoder().decode(plain));
}
async function go(){
 const pw=document.getElementById('pw').value;
 if(!pw)return;
 document.getElementById('err').style.display='none';
 document.getElementById('busy').style.display='block';
 try{
  await unlock(pw);
  try{if(document.getElementById('rm')&&document.getElementById('rm').checked)localStorage.setItem('twq_pw',pw);}catch(e){}
 }catch(e){
  document.getElementById('busy').style.display='none';
  document.getElementById('err').style.display='block';
 }
}
// retire any old service worker + caches from the pre-lock site
try{
 if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}
 if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
}catch(e){}
// same-tab refresh: reuse the session key, no retyping - but only AFTER the page finishes loading
async function sessionUnlock(){
 try{
  const kb=sessionStorage.getItem('twq_k');
  if(!kb)return;
  document.getElementById('busy').style.display='block';
  const raw=Uint8Array.from(atob(kb),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const u=b(CFG.ct);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12));
  writeApp(new TextDecoder().decode(plain));
 }catch(e){
  try{sessionStorage.removeItem('twq_k');}catch(_){}
  try{document.getElementById('busy').style.display='none';}catch(_){}
 }
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',sessionUnlock);}
else{sessionUnlock();}
document.getElementById('go').addEventListener('click',go);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
function __autoPw(){
 try{
  const saved=localStorage.getItem('twq_pw');
  if(saved){document.getElementById('pw').value=saved; go();}
 }catch(e){}
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',__autoPw);}
else{__autoPw();}
